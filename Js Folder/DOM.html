<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM IN JAVASCRIPT</title>
</head>
<body>
        <div id="para">
            <h1 id="demo">Arun</h1>
            <p class="cls" id="id2">Bala</p>
            <h2 id="deepak">Deepak</h2>
            <p id="dhanesh">Dhanesh</p>
            <h1 class="cls" id="id1">Preetham</h1>
            <p id="avinash">Avinash</p>
            <h2 id="ragul">Ragul</h2>
        </div>

    <script>
        //DOM METHODS
        //DOCUMENT.GETELEMENT BY USING ID ---> It is used to return entire element W.R.T ID
        let a=document.getElementById("demo")
        console.log(a);

        //DOCUMENT.GETELEMENTBYCLASSNAME  ---> It is used to return all the element W.R.T classname in the form html collection
        let b=document.getElementsByClassName("cls")
        console.log(b);

        //DOCUMENT.GETELEMENTBYTAGNAME  ---> It is used to return all the element W.R.T tagname in the form html collection
        let c=document.getElementsByTagName("h2")
        console.log(c);

        //QUERYSELECTOR --->It is used to return a single element whenever we have multiple elements with the same tag name based upon the priority
        let d=document.querySelector("h2")
        console.log(d);

        //QUERYSELECTORALL --->It is used to return all the elements in the form nodelist
        let e=document.querySelectorAll("h2")
        console.log(e);

        //DOM PROPERTIES 
        //IN DOM WE USE DIFFERENT DOM PROPERTIES THEY ARE....
        //DOCUMENT.HEAD
        //DOCUMENT.BODY
        //DOCUMENT.TITLE

        //DOCUEMENT.HEAD ---> IT IS USED TO PROVIDE THE HEAD AND THE ELEMENTS PRESENT INSIDE THE HEAD SEPARATELY FROM THE ENTIRE STRUCTURE
        console.log(document.head);

        //DOCUEMENT.BODY ---> IT IS USED TO PROVIDE THE BODY AND ALL THE ELEMENTS THAT ARE PRESENT INSIDE THE BODY
        console.log(document.body);

        //DOCUMENT.TITILE ---> IT IS USED TO PROVIDE THE TITLE OF THE DOCUMENT SEPARATELY FROM THE ENTIRE STRUCTURE OF HTML
        console.log(document.title);

        //DOM MANIPULATION...
        //WE CAN MANIPULATE THE DOM BY USING DIFFERENT WAYS IN WHICH BY
        //CREATING AN ELEMENT
        //ADDING THE CONTENT
        //ADDING AN ELEMENT
        //REMOVING AN ELEMENT
        //INSERTING AN ELEMENT
        //REPLACING AN ELEMENT

        //CREATING AN ELEMENT
        //INORDER TO CREATE AN ELEMENT WE SHOULD USE DOCUMENT.createElement

        let n=document.createElement("h1")
        console.log(n);

        //ADDING THE CONTENT
        //INORDER TO ADD THE TEXT INSIDE THE ELEMENT WE SHOULD USE(INNERTEXT)
        n.innerText="MS DHONI"
        console.log(n);

        let m=document.createElement("p")
        console.log(m);

        m.innerText="Suresh Raina"
        console.log(m);

        //ADDING AN ELEMENT
        //INORDER TO ADD AN ELEMENT INSIDE THE DOM TREE WE SHOULD USE(APPENDCHILD)

        let parent=document.getElementById("para")
        console.log(parent);

        parent.appendChild(n)
        console.log(parent);

        parent.appendChild(m)
        console.log(parent);

        //REMOVING AN ELEMENT
        //INORDER TO REMOVE AN ELEMENT WE SHOULD USE REMOEVE METHOD..

        let mintu=document.getElementById("id1")
        console.log(mintu);

        console.log(parent);

        mintu.remove()
        console.log(parent);

        let last=document.getElementById("id2")
        console.log(parent);

        last.remove()
        console.log(parent);

        m.remove()
        console.log(parent);

        //INSERTING AN ELEMENT
        //INORDER TO INSERT AN ELEMENT WE SHOULD USE(INSERTBEFORE)
        a=document.getElementById("demo")
        console.log(a);

        console.log(parent);

        parent.insertBefore(n,a);
        console.log(parent);

        let x=document.getElementById("avinash")
        console.log(x);

        let y=document.getElementById("deepak")
        console.log(y);

        parent.insertBefore(x,y)
        console.log(parent);

        //REPLACING THE ELEMENT
        //INORDER TO REPLACE AN ELEMENT WE SHOULD USE(REPLACECHILDREN)
        let z=document.getElementById("ragul")
        console.log(z);
         
        y=document.getElementById("deepak")
        console.log(y);

        y.replaceChildren(z)
        console.log(parent);

        let k=document.getElementById("dhanesh")
        console.log(k);

        x=document.getElementById("avinash")
        console.log(x);

        k.replaceChildren(x)
        console.log(parent);


        //DIFFERNECE BETWEEN INNERTEXT AND INNERHTML?
        // INNERTEXT ---> IT IS USED TO PROVIDE THE TEXT FOR ALL THE ELEMENTS THAT ARE PRESENT INSIDE THE PARENT
        console.log(parent.innerText);
        //INNERHTML ----> IT IS USED TO PROVIDE ALL THE ELEMENTS THAT ARE PRESENT INSIDE THE PARENT
        console.log(parent.innerHTML);

        //PROVDING STYLING BY USING IAVASCRIPT

        //By taking reference from the entire body
        document.body.style.color="White"
        document.body.style.backgroundColor="deeppink"
        document.body.style.border="10px double black"
        document.body.style.textAlign="center"

        //By taking refernece from a single element
        x.style.color="gold"
        x.style.backgroundColor="green"
        x.style.borderRadius="12px"


        


    </script>
</body>
</html>
