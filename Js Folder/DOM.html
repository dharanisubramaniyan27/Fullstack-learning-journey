<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM IN JAVASCRIPT</title>
</head>
<body>
        <div id="para">
            <h1 id="demo">Arun</h1>
            <p class="cls" id="id2">Bala</p>
            <h2>Deepak</h2>
            <p id="demo">Dhanesh</p>
            <h1 class="cls" id="id1">Preetham</h1>
            <p>Avinash</p>
            <h2>Ragul</h2>
        </div>

    <script>
        //DOCUMENT.GETELEMENT BY USING ID ---> It is used to return entire element W.R.T ID
        let a=document.getElementById("demo")
        console.log(a);

        //DOCUMENT.GETELEMENTBYCLASSNAME  ---> It is used to return all the element W.R.T classname in the form html collection
        let b=document.getElementsByClassName("cls")
        console.log(b);

        //DOCUMENT.GETELEMENTBYTAGNAME  ---> It is used to return all the element W.R.T tagname in the form html collection
        let c=document.getElementsByTagName("h2")
        console.log(c);

        //QUERYSELECTOR --->It is used to return a single element whenever we have multiple elements with the same tag name based upon the priority
        let d=document.querySelector("h2")
        console.log(d);

        //QUERYSELECTORALL --->It is used to return all the elements in the form nodelist
        let e=document.querySelectorAll("h2")
        console.log(e);

        //DOM PROPERTIES 
        //IN DOM WE USE DIFFERENT DOM PROPERTIES THEY ARE....
        //DOCUMENT.HEAD
        //DOCUMENT.BODY
        //DOCUMENT.TITLE

        //DOCUEMENT.HEAD ---> IT IS USED TO PROVIDE THE HEAD AND THE ELEMENTS PRESENT INSIDE THE HEAD SEPARATELY FROM THE ENTIRE STRUCTURE
        console.log(document.head);

        //DOCUEMENT.BODY ---> IT IS USED TO PROVIDE THE BODY AND ALL THE ELEMENTS THAT ARE PRESENT INSIDE THE BODY
        console.log(document.body);

        //DOCUMENT.TITILE ---> IT IS USED TO PROVIDE THE TITLE OF THE DOCUMENT SEPARATELY FROM THE ENTIRE STRUCTURE OF HTML
        console.log(document.title);

        //DOM MANIPULATION...
        //WE CAN MANIPULATE THE DOM BY USING DIFFERENT WAYS IN WHICH BY
        //CREATING AN ELEMENT
        //ADDING THE CONTENT
        //ADDING AN ELEMENT
        //REMOVING AN ELEMENT
        //INSERTING AN ELEMENT
        //REPLACING AN ELEMENT

        //CREATING AN ELEMENT
        //INORDER TO CREATE AN ELEMENT WE SHOULD USE DOCUMENT.createElement

        let n=document.createElement("h1")
        console.log(n);

        //INORDER TO ADD THE TEXT INSIDE THE ELEMENT WE SHOULD USE(INNERTEXT)
        n.innerText="MS DHONI"
        console.log(n);

        let m=document.createElement("p")
        console.log(m);

        m.innerText="Suresh Raina"
        console.log(m);

        //ADDING AN ELEMENT
        //INORDER TO ADD AN ELEMENT INSIDE THE DOM TREE WE SHOULD USE(APPENDCHILD)

        let parent=document.getElementById("para")
        console.log(parent);

        parent.appendChild(n)
        console.log(parent);

        parent.appendChild(m)
        console.log(parent);

        //REMOVING AN ELEMENT
        //INORDER TO REMOVE AN ELEMENT WE SHOULD USE REMOEVE METHOD..

        let mintu=document.getElementById("id1")
        console.log(mintu);

        console.log(parent);

        mintu.remove()
        console.log(parent);

        let last=document.getElementById("id2")
        console.log(parent);

        last.remove()
        console.log(parent);

        m.remove()
        console.log(parent);

        //INSERTING 
    </script>
</body>
</html>
