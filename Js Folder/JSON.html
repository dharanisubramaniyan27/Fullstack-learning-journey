    <script>
        let obj=`{
        "Name":"Raja",
        "Age":18,

        }`
        console.log(obj);

        //INORDER TO CONVERT JSON TO NORMAL WE SHOULD USE JSON.PARSE()

        console.log(a);

        let person={
            name:"Prasanna",

            city:"Ap",

        }
        console.log(person);

        //INORDER TO CHANGE NORMAL TO JSON WE SHOULD USE JSON.STRINGFY()
        let b=JSON.stringify(person)
        console.log(b);

    </script>
