<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>PROMISES IN JS</h1>

    <script>

        //PROMISES

        //CREATING A PROMISE

        let marks=60;

        let mypromise = new Promise((resolve,reject)=>{
            if(marks>90){
                resolve("you will get a bike..")
            }
            else{
                reject("you will not get a bike..")
            }
        })

        //HANDLING THE PROMISE

        mypromise
        .then((resolve)=>{
            console.log("you will get a bike..")
        })
        .catch((reject)=>{
            console.log("you will not get a bike..")
        })
        .finally(()=>{
            console.log("i am finally block..")
        })


        let network="yes";
        let mypromise2 = new Promise((resolve,reject)=>{
            if(network=="yes"){
                resolve("network is available")
            }
            else{
                reject("network is unavailable")
            }
        })

        //HANDLING THE PROMISE IN ASYNC AND WAIT WAY
        async function name() {
            try{
                let result= await mypromise2
                console.log(result)
            }
            catch{
                console.log("error rejected...")
            }
            finally{
                console.log("i am finally block...")
            }
        }
        name()

    </script>
</body>
</html>
