    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        //BOM-->Browser object Model 
        //BOM helsps javascript to communicate with the browser 
        //It will give some information about the browser that we are using
        //Here Information is nothing but screen height,width,location,etc..
        //In bom one the most imp thing is window object which consists of different methods and properties

        console.log(window);
        console.log(window.screen.height);
        console.log(window.screen.width);
        console.log(navigator.cookieEnabled);
        console.log(window.location.href);
        console.log(navigator.appCodeName);
        console.log(navigator.appName);
        console.log(navigator.platform);
    </script>
