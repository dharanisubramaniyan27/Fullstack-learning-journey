<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //FOR-LOOP

        for(let i=0; i<=7; i++){
            console.log(i)
        }
        for(let a=50; a<=54;a++){ 
        console.log(a)
        }

         //WHILE
        let x=65;
        while(x<=67){
            console.log(x)
            x++
        }

        let y=99;
        while(y<=100){
            console.log(y)
            y++
        }

        //DO-WHILE LOOP
        let m=20;
        do{
            console.log(m)
            m++
        }while(m<=25)

        let n=100;
        do{
            console.log(n)
            n++
        }while(n<=102)

    </script>
</body>
</html>
