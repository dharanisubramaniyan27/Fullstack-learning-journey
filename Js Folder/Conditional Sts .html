<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //IF----
        let a=100; 
        let b=50;
        if(a+b>100){
            console.log("I am if block");
        }

        //IF-ELSE
        let c=20;
        let d=90;
        if(c+d==200){
            console.log("I am if block")
        }
        else{
            console.log("I am else block")
        }

        //IF-ELSE-LADDER
        let m=200;
        let n=150;
        if(m+n==200){
            console.log("I am if block")
        }
        else if(m==200){
            console.log("I am if-else block")
        }
        else{
            console.log("I am else block")
        }

        let x=500;
        let y=100;
        if(x+y==600){
            console.log("I am if block")
        }
        else if(x+y>500){
            console.log("I am if-else block")
        }
        else{
            console.log("I am else block")
        }

        //SWTICH CASE
        let day=3;
        let dayName;
        switch(day){
            case 1:
                console.log("Sunday")
                break
            case 2:
                console.log("Monday")
                break
            case 3:
                console.log("Tuesday")
                break
            case 4:
                console.log("Wednesday")
                break
            case 5:
                console.log("Thursday")
                break
            case 6:
                console.log("Friday")
                break
            case 7:
                console.log("Saturday")
                break
            default:
                console.log("Invalid day")
        }
        console.log(DayName)

    </script>
</body>
</html>
